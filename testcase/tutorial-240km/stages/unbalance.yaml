unbalance:
  drivers:
    # Legacy materialized path reads the rank-local sampling products from VBAL.
    read local sampling: true

    # The validated legacy inversion does not require global sampling.
    read global sampling: false

    # Read the calibrated vertical-balance coefficients.
    read vertical balance: true
