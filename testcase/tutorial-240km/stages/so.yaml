# =============================================================================
# MPAS-BMatrix scientific contract — Single Observation (SO) validation
# =============================================================================
#
# Purpose
# -------
# Configures a 3D-Var single-observation experiment that applies the complete
# calibrated B operator: NICAS + StdDev + VBAL + Control2Analysis.
#
# Rebuild boundary
# ----------------
# Changes affect SO validation only unless analysis/background variable lists are
# also reused by DIRAC. DIRAC currently reuses analysis_variables to guarantee
# the same Control2Analysis output contract, so changes to that list require
# rerunning both SO and DIRAC.
#
# How to modify it
# ----------------
# - analysis_variables are canonical JEDI analysis-space names.
# - background_variables must contain every analysis variable plus any native or
#   derived fields needed to build the MPAS State and observation operators.
# - observations are synthetic validation points; they do not train B.
# - variants select named observations without duplicating their definitions.
# =============================================================================

single_observation:
  # Hours before the analysis time at which the observation window begins.
  window_hours_before_analysis: 3

  # Total observation-window length in hours.
  window_hours: 6

  # OOPS inner-loop minimizer algorithm.
  minimizer: DRPCG

  # Number of inner minimization iterations.
  ninner: 10

  # Relative gradient-norm stopping threshold.
  gradient_norm_reduction: 1e-3

  # Canonical variables produced by Control2Analysis and updated by the analysis.
  analysis_variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - air_pressure_at_surface

  # Variables requested in the background State. This list must include all
  # analysis_variables. Additional canonical, control-file and MPAS-native fields
  # support variable changes, the MPAS geometry and observation operators.
  background_variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - air_pressure_at_surface
    - air_pressure
    - spechum
    - surface_pressure
    - temperature
    - uReconstructMeridional
    - uReconstructZonal
    - theta
    - rho
    - u
    - qv
    - pressure
    - pressure_p

  observations:
    temperature:
      # IODA observation-space name.
      name: SO_T

      # Variable name expected by the selected observation operator.
      simulated_variable: airTemperature

      # Observation latitude in degrees north.
      latitude: 30.3061

      # Observation longitude in degrees east using the accepted 0–360 range.
      longitude: 130.085

      # Observation pressure coordinate in pascals.
      pressure: 78775.95

      # Prescribed observation-error standard deviation.
      error: 0.8

      # Synthetic observed value.
      value: 284.5912

      # HDF5 output file written for this observation space.
      output_file: obsout_SO_T.h5

    eastward_wind:
      # IODA observation-space name.
      name: SO_U

      # Variable name expected by the selected observation operator.
      simulated_variable: windEastward

      # Observation latitude in degrees north.
      latitude: 57.7699

      # Observation longitude in degrees east using the accepted 0–360 range.
      longitude: 357.713

      # Observation pressure coordinate in pascals.
      pressure: 77693.09

      # Prescribed observation-error standard deviation.
      error: 1.0

      # Synthetic observed value.
      value: 0.7250047

      # HDF5 output file written for this observation space.
      output_file: obsout_SO_U.h5

  variants:
    # Default validation runs both configured observations.
    default: [temperature, eastward_wind]

    # Temperature-only diagnostic variant selected with --so-variant t-only.
    t-only: [temperature]

    # Eastward-wind-only diagnostic selected with --so-variant u-only.
    u-only: [eastward_wind]
