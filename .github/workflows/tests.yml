name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"
      - "fix/**"
      - "feature/**"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,diagnostics]"

      - name: Compile package
        run: python -m compileall -q src/bmatrix

      - name: Validate shell syntax
        run: |
          bash -n scripts/load_jaci_env.sh
          for script in templates/pbs/*.pbs; do
            bash -n "$script"
          done

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -q

      - name: Ruff
        run: python -m ruff check src/bmatrix tests
