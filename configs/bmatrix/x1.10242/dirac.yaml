# =============================================================================
# MPAS-BMatrix scientific contract — complete-B DIRAC validation
# =============================================================================
#
# Purpose
# -------
# Configures a covariance-toolbox impulse response using the complete static B:
# NICAS + StdDev + VBAL + Control2Analysis. This is distinct from the internal
# NICAS-only diagnostic configured in nicas.yaml.
#
# Rebuild boundary
# ----------------
# Changes affect DIRAC and its plots. They do not recalibrate VBAL/HDIAG/NICAS.
#
# How to modify it
# ----------------
# - variable must be a canonical control declared in controls.yaml.
# - index is one-based and selects the same element in latitudes/longitudes.
# - keep the full latitude/longitude arrays: the validated toolbox contract uses
#   dirLats/dirLons plus singular ildir/dirvar selectors.
# - background_variables must include every analysis variable declared in
#   single-observation.yaml because DIRAC applies the same Control2Analysis.
# =============================================================================

dirac:
  # Number of impulses requested from the toolbox. The maintained workflow uses
  # one selected point/variable per run.
  ndir: 1

  # One-based position selected from latitudes and longitudes. With the current
  # lists, index 10 selects Buenos Aires (-34.60250161, -58.39753137).
  index: 10

  # Canonical B control receiving the impulse.
  variable: air_temperature

  # Variables available in the background State used by the complete-B test.
  # The list must cover single_observation.analysis_variables and any additional
  # native/derived MPAS fields needed by geometry or variable changes.
  background_variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - air_pressure_at_surface
    - air_pressure
    - u
    - rho
    - theta
    - pressure_p

  # Candidate point latitudes in degrees north. The list length and ordering must
  # exactly match longitudes.
  latitudes: [30.31011691, 26.56505123, 35.68501691, 19.01699038, 19.44244244, 31.21645245, -23.55867959, 40.74997906, 24.86999229, -34.60250161, 28.6699929, 55.75216412, 41.10499615, 23.72305971, 30.04996035, 37.5663491, 22.4949693, 39.92889223, -6.174417705, 33.98997825, 51.49999473, 35.67194277]

  # Candidate point longitudes in degrees east. Negative values represent west.
  # The one-based index selects from this list and latitudes simultaneously.
  longitudes: [130.11182691, -102.95294521, 139.7514074, 72.8569893, -99.1309882, 121.4365047, -46.62501998, -73.98001693, 66.99000891, -58.39753137, 77.23000403, 37.61552283, 29.01000159, 90.40857947, 31.24996822, 126.999731, 88.32467566, 116.3882857, 106.8294376, -118.1799805, -0.116721844, 51.42434403]
