# =============================================================================
# MPAS-BMatrix — JACI site/runtime base configuration
# =============================================================================
#
# This file contains only JACI/runtime settings shared by B-matrix cases.
# Scientific BUMP/VBAL/HDIAG/NICAS settings belong in the stage fragments.
# GFS/WPS/MPAS forecast production belongs to mpaswf.
#
# Runtime software contract
# -------------------------
# MONAN-JEDI is the single producer of the compiled MPAS/JEDI runtime consumed
# here. Set one public installation prefix:
#
#   export MONAN_JEDI_INSTALL_ROOT=/p/projetos/monan_das/$USER/build/monan-jedi
#
# MPAS-BMatrix derives executables from <root>/bin and MPAS support files from
# <root>/share. It must not read MONAN-JEDI source or work/build trees.
#
# Compatibility: MONAN_JEDI_INSTALL is still accepted by the Python config
# loader when MONAN_JEDI_INSTALL_ROOT is not defined.
# =============================================================================

project:
  name: MPAS-BMatrix
  project_root: /p/projetos/monan_das/$USER/projects/MPAS-BMatrix
  work_root: /p/projetos/monan_das/$USER/work/MPAS-BMatrix

environment:
  loader: scripts/load_jaci_env.sh
  variables:
    # Spack-stack checkout selected by the user before running MPAS-BMatrix.
    # Keeping this as an environment reference guarantees that generated PBS
    # jobs use the same stack chosen for the login-shell validation.
    STACK_ROOT: ${STACK_ROOT}

    # Job-local JACI runtime policy. These values are exported only after the
    # selected stack has been reconstructed on the compute node. They are site
    # configuration, not ecosystem-wide anchors.
    OMP_NUM_THREADS: "1"
    GFORTRAN_CONVERT_UNIT: "big_endian:101-200"
    FI_CXI_RX_MATCH_MODE: "hybrid"

install:
  # Canonical MONAN-JEDI public runtime prefix.
  root: ${MONAN_JEDI_INSTALL_ROOT}

  # MPAS CMake installs the atmosphere core runtime tables here.
  atmosphere_share: ${MONAN_JEDI_INSTALL_ROOT}/share/MPAS/core_atmosphere

  # Do not configure executable paths individually. Stages derive them from
  # install.root/bin; for example:
  #   mpasjedi_error_covariance_toolbox.x
  #   mpasjedi_variational.x
  #   mpasjedi_unbalance_ensemble.x

pbs:
  # MPI launcher policy belongs to the site scheduler layer. Stage modules
  # provide only the scientific executable and its arguments.
  launcher: ["mpiexec", "-n", "{mpi_ranks}"]

  queues:
    bmatrix: pesqmidi

  walltime:
    bmatrix: "02:00:00"
