# =============================================================================
# MPAS-BMatrix — JACI site/runtime base configuration
# =============================================================================
#
# Purpose
# -------
# This file contains settings that are common to MPAS-BMatrix runs on the JACI
# cluster and do not depend on a particular MPAS mesh or B-matrix experiment.
# It is a BASE file: users normally pass configs/jaci-x1.10242.yaml to the CLI,
# and that case file includes this one automatically.
#
# User-facing behavior
# --------------------
# The public `mpas-bmatrix` CLI resolves the roots below before composing this
# YAML. Explicit environment variables remain supported as advanced overrides,
# but normal users should start with `mpas-bmatrix setup --site jaci` followed
# by `mpas-bmatrix doctor` instead of exporting every path manually.
#
# Keep only machine/site/build settings here. Scientific BUMP/VBAL/HDIAG/NICAS
# parameters belong in the stage-specific scientific configuration fragments.
# GFS, WPS, MPAS initialization and forecast generation belong to mpaswf.
#
# PBS note
# --------
# PBS does not guarantee that arbitrary variables exported in the login shell
# are inherited by compute jobs. Variables required by environment.loader must
# therefore be listed explicitly under environment.variables. The scheduler
# renders them into every PBS script before sourcing the loader.
# =============================================================================

project:
  # Human-readable project identifier used in resolved configuration/provenance.
  name: MPAS-BMatrix

  # Resolved automatically by the CLI from the installed/checked-out package.
  project_root: ${BMATRIX_ROOT}

  # User workspace. `setup` provides a JACI default and allows one override.
  work_root: ${WORK_ROOT}

environment:
  # Path to the shell environment loader, relative to project.project_root.
  loader: scripts/load_jaci_env.sh

  # Values needed by the loader inside PBS jobs. STACK_ROOT is resolved by the
  # JACI site discovery or may be explicitly overridden by an advanced user.
  variables:
    STACK_ROOT: ${STACK_ROOT}

install:
  # Installation prefix containing MPAS-JEDI/SABER executables under bin/ and
  # MPAS runtime files under share/. The CLI first honors an explicit override,
  # then attempts command/site discovery.
  root: ${MONAN_JEDI_INSTALL}

  # MPAS core_atmosphere tables/files copied or linked into stage workspaces.
  atmosphere_share: ${MONAN_JEDI_INSTALL}/share/MPAS/core_atmosphere

  # Conventional installation location. No separate user variable is required.
  unbalance_executable: ${MONAN_JEDI_INSTALL}/bin/mpasjedi_unbalance_ensemble.x

pbs:
  queues:
    # PBS queue used by VBAL, UNBALANCE, HDIAG, NICAS, SO and DIRAC jobs.
    bmatrix: pesqmidi

  walltime:
    # Wall-clock request shared by B-matrix PBS jobs.
    bmatrix: "02:00:00"
