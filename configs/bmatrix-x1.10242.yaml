# =============================================================================
# MPAS-BMatrix — scientific-contract aggregator for x1.10242
# =============================================================================
#
# Purpose
# -------
# This file is the SINGLE scientific-contract path referenced by
# configs/jaci-x1.10242.yaml. It composes the production scientific fragments
# plus the temporary legacy UNBALANCE fragment used only for A/B validation.
#
# The production scientific workflow is:
#
#   controls -> BFLOW -> VBAL -> HDIAG -> NICAS -> SO -> DIRAC
#
# HDIAG applies inverse BUMP_VerticalBalance in memory. The unbalance.yaml
# fragment is intentionally retained during migration so the previous
# materialized K2^-1 path can be reproduced for numerical comparison; it is not
# part of bmatrix.pipeline.STAGES.
#
# PLOTS receives its user options from the CLI and has no scientific YAML
# fragment.
#
# Stage fragments
# ---------------
# controls.yaml   canonical/file names and 3D/2D dimensions
# bflow.yaml      NMC preprocessing, products and derived variables
# vbal.yaml       vertical-balance calibration
# unbalance.yaml  LEGACY A/B reference for materialized K2^-1 samples
# hdiag.yaml      variance/correlation diagnostics; consumes VBAL in memory
# nicas.yaml      NICAS calibration and internal diagnostics
# so.yaml         complete-B variational single-observation validation
# dirac.yaml      complete-B impulse-response validation
# =============================================================================

schema_version: 2

include:
  - bmatrix/x1.10242/controls.yaml
  - bmatrix/x1.10242/bflow.yaml
  - bmatrix/x1.10242/vbal.yaml
  # Temporary migration support. Remove after the documented A/B validation.
  - bmatrix/x1.10242/unbalance.yaml
  - bmatrix/x1.10242/hdiag.yaml
  - bmatrix/x1.10242/nicas.yaml
  - bmatrix/x1.10242/so.yaml
  - bmatrix/x1.10242/dirac.yaml
